<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
<meta name="theme-color" content="#0b0f0c"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
<meta name="apple-mobile-web-app-title" content="FF Scores"/>
<title>Fantasy Football — Live Scores</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E🏈%3C/text%3E%3C/svg%3E"/>
<style>
  :root{
    --bg:#0b0f0c; --surface:#111713; --surface2:#0e1410; --border:#1e2a22;
    --text:#e9f1ea; --muted:#8ba295; --faint:#5f7368;
    --accent:#22c55e; --accent-dim:#16351f; --amber:#f5a524; --red:#f4685f;
    --shadow:0 1px 0 rgba(255,255,255,.02),0 8px 24px rgba(0,0,0,.35);
  }
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
  html{-webkit-text-size-adjust:100%}
  body{
    background:var(--bg);color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    -webkit-font-smoothing:antialiased;line-height:1.4;
    min-height:100vh;overscroll-behavior-y:none;
    padding:0 14px calc(env(safe-area-inset-bottom,0) + 32px);
    max-width:640px;margin:0 auto;
  }
  /* ── Header ─────────────────────────────── */
  header{
    position:sticky;top:0;z-index:20;background:rgba(11,15,12,.82);
    backdrop-filter:saturate(1.4) blur(12px);-webkit-backdrop-filter:saturate(1.4) blur(12px);
    padding:calc(env(safe-area-inset-top,0) + 12px) 2px 10px;
    border-bottom:1px solid var(--border);margin-bottom:14px;
  }
  .brand{display:flex;align-items:center;gap:9px}
  .brand h1{font-size:19px;font-weight:750;letter-spacing:-.02em;flex:1;min-width:0}
  .brand .fb{font-size:20px}
  .iconbtn{
    appearance:none;border:1px solid var(--border);background:var(--surface);
    color:var(--text);width:38px;height:38px;border-radius:10px;font-size:16px;
    display:grid;place-items:center;cursor:pointer;transition:.15s;flex:none;
  }
  .iconbtn:active{transform:scale(.94)}
  .iconbtn.spin{animation:spin .8s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  .statusbar{display:flex;align-items:center;gap:8px;margin-top:9px;font-size:12.5px;color:var(--muted);min-height:16px}
  .dot{width:7px;height:7px;border-radius:50%;background:var(--faint);flex:none}
  .dot.live{background:var(--accent);box-shadow:0 0 0 0 rgba(34,197,94,.5);animation:pulse 2s infinite}
  .dot.err{background:var(--red)}
  @keyframes pulse{0%{box-shadow:0 0 0 0 rgba(34,197,94,.45)}70%{box-shadow:0 0 0 7px rgba(34,197,94,0)}100%{box-shadow:0 0 0 0 rgba(34,197,94,0)}}
  .statusbar .wk{color:var(--text);font-weight:600}
  .statusbar .sep{color:var(--faint)}
  /* ── League card ────────────────────────── */
  .league{
    background:var(--surface);border:1px solid var(--border);border-radius:16px;
    margin-bottom:13px;box-shadow:var(--shadow);overflow:hidden;
  }
  .league-head{display:flex;align-items:center;gap:8px;padding:12px 14px 10px}
  .league-head .lname{font-size:13px;font-weight:700;color:var(--muted);letter-spacing:.01em;text-transform:uppercase;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .badge{font-size:10.5px;font-weight:700;color:var(--faint);border:1px solid var(--border);border-radius:999px;padding:2px 8px;flex:none}
  /* matchup rows */
  .team{display:flex;align-items:center;gap:11px;padding:11px 14px;position:relative}
  .team + .team{border-top:1px solid var(--border)}
  .team .av{width:34px;height:34px;border-radius:9px;background:var(--surface2);border:1px solid var(--border);flex:none;display:grid;place-items:center;font-size:15px;overflow:hidden}
  .team .av img{width:100%;height:100%;object-fit:cover}
  .team .meta{flex:1;min-width:0}
  .team .tn{font-size:15px;font-weight:650;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .team .mgr{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .team .pts{font-size:22px;font-weight:750;font-variant-numeric:tabular-nums;letter-spacing:-.02em;flex:none;transition:color .25s}
  .team.lead{background:linear-gradient(90deg,var(--accent-dim),transparent 60%)}
  .team.lead::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--accent)}
  .team.lead .pts{color:var(--accent)}
  .team.lead .tn{font-weight:750}
  .team.loss .tn,.team.loss .pts{color:var(--muted)}
  .rec{font-size:11px;color:var(--faint);font-weight:600;margin-left:6px}
  /* footer / margin line */
  .mline{display:flex;align-items:center;justify-content:space-between;padding:9px 14px;border-top:1px solid var(--border);background:var(--surface2)}
  .mline .m{font-size:12.5px;color:var(--muted)}
  .mline .m b{color:var(--text)}
  .expand{appearance:none;background:none;border:none;color:var(--accent);font-size:12.5px;font-weight:650;cursor:pointer;padding:4px 2px;display:flex;align-items:center;gap:5px}
  .expand .chev{transition:transform .2s}
  .expand[aria-expanded="true"] .chev{transform:rotate(90deg)}
  /* lineups panel */
  .lineups{display:none;padding:4px 10px 12px;background:var(--surface2);border-top:1px solid var(--border)}
  .lineups.open{display:block}
  .lu-grid{display:grid;grid-template-columns:1fr auto 1fr;gap:2px 10px;align-items:center}
  .lu-slot{grid-column:1/-1;text-align:center;font-size:10px;font-weight:700;color:var(--faint);letter-spacing:.06em;margin:6px 0 2px}
  .pl{display:flex;align-items:center;gap:8px;padding:5px 4px;min-width:0}
  .pl.r{flex-direction:row-reverse;text-align:right}
  .pl .pn{font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1;min-width:0}
  .pl .pp{font-size:14px;font-weight:750;font-variant-numeric:tabular-nums;color:var(--text);flex:none}
  .pl .pmeta{font-size:10.5px;color:var(--faint)}
  .pl.top .pp{color:var(--accent)}
  .lu-vs{font-size:10px;color:var(--faint);text-align:center;font-weight:700}
  /* misc states */
  .note{padding:12px 14px;font-size:13px;color:var(--muted)}
  .skeleton{height:118px;border-radius:16px;background:linear-gradient(100deg,var(--surface) 30%,#16211a 50%,var(--surface) 70%);background-size:200% 100%;animation:sh 1.3s infinite;margin-bottom:13px}
  @keyframes sh{to{background-position:-200% 0}}
  .empty{text-align:center;padding:44px 20px;color:var(--muted)}
  .empty .big{font-size:34px;margin-bottom:10px}
  .empty h2{font-size:16px;color:var(--text);margin-bottom:6px}
  .empty p{font-size:13.5px;line-height:1.5}
  .linkbtn{color:var(--accent);background:none;border:none;font:inherit;font-weight:650;cursor:pointer;text-decoration:underline;padding:0}
  /* settings sheet */
  .scrim{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:40;display:none;opacity:0;transition:opacity .2s}
  .scrim.show{display:block;opacity:1}
  .sheet{position:fixed;left:0;right:0;bottom:0;z-index:41;background:var(--surface);border-top-left-radius:20px;border-top-right-radius:20px;border-top:1px solid var(--border);padding:18px 18px calc(env(safe-area-inset-bottom,0) + 22px);max-width:640px;margin:0 auto;transform:translateY(100%);transition:transform .25s cubic-bezier(.2,.8,.2,1)}
  .sheet.show{transform:translateY(0)}
  .sheet h2{font-size:16px;margin-bottom:14px}
  .field{margin-bottom:14px}
  .field label{display:block;font-size:12px;font-weight:650;color:var(--muted);margin-bottom:6px}
  .field input,.field select{width:100%;background:var(--surface2);border:1px solid var(--border);color:var(--text);border-radius:10px;padding:11px 12px;font-size:16px;font-family:inherit}
  .field input:focus,.field select:focus{outline:none;border-color:var(--accent)}
  .savebtn{width:100%;background:var(--accent);color:#04140a;border:none;border-radius:11px;padding:13px;font-size:15px;font-weight:750;cursor:pointer;margin-top:4px}
  .savebtn:active{transform:scale(.99)}
  .hint{font-size:11.5px;color:var(--faint);margin-top:6px;line-height:1.45}
  footer{text-align:center;font-size:11px;color:var(--faint);padding:22px 0 4px}
</style>
</head>
<body>
<header>
  <div class="brand">
    <span class="fb">🏈</span>
    <h1>Fantasy Scores</h1>
    <button class="iconbtn" id="refreshBtn" title="Refresh" aria-label="Refresh">↻</button>
    <button class="iconbtn" id="settingsBtn" title="Settings" aria-label="Settings">⚙</button>
  </div>
  <div class="statusbar">
    <span class="dot" id="dot"></span>
    <span id="status">Starting…</span>
  </div>
</header>

<main id="app">
  <div class="skeleton"></div>
  <div class="skeleton"></div>
</main>

<footer>Live from Sleeper · pull to refresh anytime</footer>

<!-- Settings sheet -->
<div class="scrim" id="scrim"></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-label="Settings">
  <h2>Settings</h2>
  <div class="field">
    <label for="fUser">Sleeper username</label>
    <input id="fUser" type="text" autocapitalize="none" autocorrect="off" spellcheck="false" placeholder="chasecovert"/>
  </div>
  <div class="field">
    <label for="fSeason">Season</label>
    <input id="fSeason" type="text" inputmode="numeric" placeholder="auto (current)"/>
    <div class="hint">Leave blank to follow the current NFL season automatically.</div>
  </div>
  <div class="field">
    <label for="fInterval">Auto-refresh</label>
    <select id="fInterval">
      <option value="15">Every 15 seconds</option>
      <option value="30">Every 30 seconds</option>
      <option value="60">Every minute</option>
      <option value="0">Off (manual only)</option>
    </select>
  </div>
  <button class="savebtn" id="saveBtn">Save &amp; reload</button>
  <div class="hint">Refreshing pauses automatically when this tab is in the background to save battery and data.</div>
</div>

<script>
(function(){
  "use strict";
  var API = "https://api.sleeper.app/v1";
  var AVATAR = "https://sleepercdn.com/avatars/thumbs/";
  var DEFAULT_USER = "chasecovert";

  // ── Config (persisted) ─────────────────────────────
  function ls(k, d){ try{ var v=localStorage.getItem(k); return v==null?d:v; }catch(e){ return d; } }
  function lsSet(k, v){ try{ localStorage.setItem(k, v); }catch(e){} }
  var cfg = {
    user: (ls("ff_user", DEFAULT_USER)||"").trim() || DEFAULT_USER,
    season: (ls("ff_season","")||"").trim(),        // "" = auto
    interval: parseInt(ls("ff_interval","30"),10)    // seconds, 0 = off
  };

  // ── State ──────────────────────────────────────────
  var ST = { user:null, week:null, season:null, seasonType:null, leagues:[],
             model:{}, timer:null, loading:false, playersMap:null, lastOK:0, openSet:{} };

  var $ = function(s){ return document.querySelector(s); };
  var app = $("#app"), statusEl = $("#status"), dotEl = $("#dot");

  function esc(s){ return String(s==null?"":s).replace(/[&<>"']/g, function(c){
    return {"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]; }); }

  function fmtPts(p){ var n = (p==null||isNaN(p))?0:Number(p); return n.toFixed(1); }

  function fetchJSON(url){
    return fetch(url, {cache:"no-store"}).then(function(r){
      if(!r.ok) throw new Error("HTTP "+r.status);
      return r.json();
    });
  }

  // ── Status line ────────────────────────────────────
  function setStatus(txt, cls){
    statusEl.innerHTML = txt;
    dotEl.className = "dot" + (cls?(" "+cls):"");
  }
  function timeAgo(ts){
    if(!ts) return "";
    var s = Math.max(0, Math.round((Date.now()-ts)/1000));
    if(s<60) return s+"s ago";
    var m = Math.round(s/60); return m+"m ago";
  }
  function weekLabel(){
    if(ST.week==null) return "";
    var t = ST.seasonType && ST.seasonType!=="regular" ? (ST.seasonType.charAt(0).toUpperCase()+ST.seasonType.slice(1)+" ") : "";
    return t+"Week "+ST.week;
  }
  function refreshStatusLine(){
    if(ST.loading){ setStatus("Updating…", "live"); return; }
    if(ST.lastOK){
      setStatus('<span class="wk">'+esc(weekLabel())+'</span> <span class="sep">·</span> '+esc(ST.season||"")+
                ' <span class="sep">·</span> updated '+esc(timeAgo(ST.lastOK)), "live");
    }
  }

  // ── Boot ───────────────────────────────────────────
  function boot(){
    ST.loading = true; setStatus("Finding your leagues…","live");
    // 1) current NFL state (week/season) — non-fatal if it fails
    fetchJSON(API+"/state/nfl").then(function(state){
      ST.week = state.display_week || state.week || state.leg || 1;
      ST.seasonType = state.season_type || "regular";
      ST.season = cfg.season || String(state.season || new Date().getFullYear());
    }).catch(function(){
      ST.season = cfg.season || String(new Date().getFullYear());
      ST.week = ST.week || 1;
    }).then(function(){
      return loadUserAndLeagues();
    }).catch(showFatal);
  }

  function loadUserAndLeagues(){
    return fetchJSON(API+"/user/"+encodeURIComponent(cfg.user)).then(function(user){
      if(!user || !user.user_id) throw new Error("NO_USER");
      ST.user = user;
      return fetchJSON(API+"/user/"+user.user_id+"/leagues/nfl/"+ST.season);
    }).then(function(leagues){
      ST.leagues = leagues || [];
      if(!ST.leagues.length){ renderEmpty("no-leagues"); ST.loading=false; return; }
      return loadAllMatchups(true);
    });
  }

  // Load rosters+users+matchups for every league (parallel), build model, render.
  function loadAllMatchups(full){
    ST.loading = true; refreshStatusLine();
    var jobs = ST.leagues.map(function(lg){
      var base = API+"/league/"+lg.league_id;
      return Promise.all([
        full ? fetchJSON(base+"/rosters") : Promise.resolve(ST.model[lg.league_id] && ST.model[lg.league_id].rosters),
        full ? fetchJSON(base+"/users")   : Promise.resolve(ST.model[lg.league_id] && ST.model[lg.league_id].users),
        fetchJSON(base+"/matchups/"+ST.week)
      ]).then(function(res){
        buildModel(lg, res[0], res[1], res[2]);
      }).catch(function(e){
        ST.model[lg.league_id] = { league:lg, error:(e&&e.message)||"error" };
      });
    });
    return Promise.all(jobs).then(function(){
      ST.loading = false; ST.lastOK = Date.now();
      if(full) renderAll(); else patchScores();
      refreshStatusLine();
    });
  }

  // Build the per-league view model: my team, opponent, records.
  function buildModel(lg, rosters, users, matchups){
    var prev = ST.model[lg.league_id] || {};
    rosters = rosters || prev.rosters || [];
    users   = users   || prev.users   || [];
    var usersById = {}; users.forEach(function(u){ usersById[u.user_id]=u; });
    var rosterById = {}; rosters.forEach(function(r){ rosterById[r.roster_id]=r; });

    // find my roster (owner or co-owner)
    var myUid = ST.user.user_id, myRoster = null;
    for(var i=0;i<rosters.length;i++){
      var r = rosters[i];
      if(r.owner_id===myUid || (r.co_owners && r.co_owners.indexOf(myUid)>=0)){ myRoster=r; break; }
    }

    var mById = {}; (matchups||[]).forEach(function(m){ mById[m.roster_id]=m; });

    var model = { league:lg, rosters:rosters, users:users, usersById:usersById,
                  rosterById:rosterById, matchups:matchups||[], myRoster:myRoster };

    if(myRoster && mById[myRoster.roster_id]){
      var mine = mById[myRoster.roster_id];
      model.mine = mine;
      // opponent shares matchup_id
      if(mine.matchup_id!=null){
        for(var j=0;j<matchups.length;j++){
          var mm = matchups[j];
          if(mm.matchup_id===mine.matchup_id && mm.roster_id!==mine.roster_id){ model.opp = mm; break; }
        }
      }
    }
    ST.model[lg.league_id] = model;
  }

  function teamInfo(model, rosterId){
    var r = model.rosterById[rosterId];
    var u = r ? model.usersById[r.owner_id] : null;
    var name = (u && u.metadata && u.metadata.team_name) ? u.metadata.team_name
             : (u && u.display_name) ? u.display_name : ("Team "+rosterId);
    var mgr  = (u && u.display_name) ? u.display_name : "";
    if(mgr===name) mgr="";
    var rec = r && r.settings ? (r.settings.wins||0)+"-"+(r.settings.losses||0)+((r.settings.ties)?("-"+r.settings.ties):"") : "";
    var av = u && u.avatar ? (AVATAR+u.avatar) : "";
    return { name:name, mgr:mgr, rec:rec, avatar:av };
  }

  // ── Render ─────────────────────────────────────────
  function renderAll(){
    var html = "";
    ST.leagues.forEach(function(lg){
      html += renderLeague(ST.model[lg.league_id] || {league:lg});
    });
    app.innerHTML = html || "";
    // reattach expander handlers + restore open state
    Array.prototype.forEach.call(app.querySelectorAll(".expand"), function(btn){
      btn.addEventListener("click", onExpand);
      if(ST.openSet[btn.getAttribute("data-lg")]){ openLineups(btn, true); }
    });
  }

  function renderLeague(model){
    var lg = model.league;
    var head = '<div class="league-head"><span class="lname">'+esc(lg.name||"League")+'</span>'+
               '<span class="badge">'+esc((lg.settings&&lg.settings.num_teams)||lg.total_rosters||"")+' teams</span></div>';

    if(model.error){
      return '<section class="league">'+head+'<div class="note">Couldn’t load this league ('+esc(model.error)+'). It’ll retry on the next refresh.</div></section>';
    }
    if(!model.myRoster){
      return '<section class="league">'+head+'<div class="note">No team found for <b>'+esc(cfg.user)+'</b> in this league.</div></section>';
    }
    if(!model.mine){
      return '<section class="league">'+head+'<div class="note">No matchup posted yet for '+esc(weekLabel())+'.</div></section>';
    }

    var lid = lg.league_id;
    var mine = teamInfo(model, model.mine.roster_id);
    var myPts = model.mine.points;

    if(!model.opp){
      // no head-to-head opponent (e.g. bye / best-ball) — show my total
      return '<section class="league">'+head+ teamRow(lid, model.mine.roster_id, mine, myPts, false, false) +'</section>';
    }

    var opp = teamInfo(model, model.opp.roster_id);
    var oppPts = model.opp.points;
    var myLead = (Number(myPts)||0) >= (Number(oppPts)||0);
    var diff = Math.abs((Number(myPts)||0)-(Number(oppPts)||0));
    var marginTxt = diff<0.05 ? "Tied up" :
        '<b>'+esc(mine.name.length>14?"You":mine.name)+"</b> "+(myLead?"up":"down")+" <b>"+fmtPts(diff)+"</b>";
    if(!myLead) marginTxt = '<b>'+esc(opp.name.length>14?opp.mgr||"Opp":opp.name)+"</b> up <b>"+fmtPts(diff)+"</b>";
    if(diff<0.05) marginTxt = "All square";

    return '<section class="league">'+ head +
      teamRow(lid, model.mine.roster_id, mine, myPts, myLead, !myLead) +
      teamRow(lid, model.opp.roster_id, opp, oppPts, !myLead, myLead) +
      '<div class="mline"><span class="m">'+marginTxt+'</span>'+
      '<button class="expand" data-lg="'+esc(lid)+'" aria-expanded="false"><span class="chev">▸</span> Lineups</button></div>'+
      '<div class="lineups" id="lu-'+esc(lid)+'"></div>'+
    '</section>';
  }

  function teamRow(lid, rosterId, t, pts, lead, loss){
    var av = t.avatar ? '<img src="'+esc(t.avatar)+'" alt="" onerror="this.style.display=\'none\';this.parentNode.textContent=\'🏈\'"/>' : '🏈';
    return '<div class="team'+(lead?" lead":"")+(loss?" loss":"")+'">'+
      '<div class="av">'+av+'</div>'+
      '<div class="meta"><div class="tn">'+esc(t.name)+'</div>'+
        '<div class="mgr">'+esc(t.mgr)+(t.rec?('<span class="rec">'+esc(t.rec)+'</span>'):"")+'</div></div>'+
      '<div class="pts" id="pts-'+esc(lid)+"-"+esc(rosterId)+'">'+fmtPts(pts)+'</div>'+
    '</div>';
  }

  // Light update of just the score numbers + leader styling (used by polling).
  function patchScores(){
    ST.leagues.forEach(function(lg){
      var model = ST.model[lg.league_id];
      if(!model || !model.mine) return;
      updatePts(lg.league_id, model.mine.roster_id, model.mine.points);
      if(model.opp) updatePts(lg.league_id, model.opp.roster_id, model.opp.points);
      // leader styling
      if(model.opp){
        var myLead = (Number(model.mine.points)||0) >= (Number(model.opp.points)||0);
        setLead(lg.league_id, model.mine.roster_id, myLead);
        setLead(lg.league_id, model.opp.roster_id, !myLead);
      }
      // if a lineup panel is open, refresh it
      if(ST.openSet[lg.league_id]){
        var panel = document.getElementById("lu-"+lg.league_id);
        if(panel && panel.classList.contains("open")) renderLineups(panel, model);
      }
    });
  }
  function updatePts(lid, rid, pts){
    var el = document.getElementById("pts-"+lid+"-"+rid);
    if(el){ var v=fmtPts(pts); if(el.textContent!==v) el.textContent=v; }
  }
  function setLead(lid, rid, lead){
    var el = document.getElementById("pts-"+lid+"-"+rid);
    if(!el) return; var row = el.closest(".team"); if(!row) return;
    row.classList.toggle("lead", !!lead); row.classList.toggle("loss", !lead);
  }

  // ── Lineups (lazy: needs the players map) ──────────
  function onExpand(e){
    var btn = e.currentTarget;
    var open = btn.getAttribute("aria-expanded")==="true";
    openLineups(btn, !open);
  }
  function openLineups(btn, open){
    var lid = btn.getAttribute("data-lg");
    var panel = document.getElementById("lu-"+lid);
    btn.setAttribute("aria-expanded", open?"true":"false");
    if(!panel) return;
    if(!open){ panel.classList.remove("open"); ST.openSet[lid]=false; return; }
    ST.openSet[lid]=true; panel.classList.add("open");
    var model = ST.model[lid];
    if(!ST.playersMap){
      panel.innerHTML = '<div class="note">Loading player names…</div>';
      loadPlayers().then(function(){ renderLineups(panel, model); })
                   .catch(function(){ panel.innerHTML='<div class="note">Couldn’t load player names.</div>'; });
    } else {
      renderLineups(panel, model);
    }
  }

  function slotLabels(lg){
    var pos = (lg.roster_positions||[]).filter(function(p){ return p!=="BN" && p!=="IR" && p!=="TAXI"; });
    return pos;
  }
  function pname(id){
    if(!id || id==="0") return {n:"—", meta:""};
    var p = ST.playersMap && ST.playersMap[id];
    if(p) return {n:p.n, meta:((p.p||"")+(p.t?(" · "+p.t):""))};
    if(/^[A-Z]{2,4}$/.test(id)) return {n:id+" D/ST", meta:"DEF"};
    return {n:id, meta:""};
  }
  function renderLineups(panel, model){
    if(!model || !model.mine || !model.opp){ panel.innerHTML='<div class="note">No lineup to show.</div>'; return; }
    var labels = slotLabels(model.league);
    var myS = model.mine.starters||[], myP = model.mine.starters_points||[];
    var opS = model.opp.starters||[], opP = model.opp.starters_points||[];
    var n = Math.max(labels.length, myS.length, opS.length);
    // find top scorer each side to highlight
    var myTop = maxIdx(myP), opTop = maxIdx(opP);
    var rows = "";
    for(var i=0;i<n;i++){
      var lbl = labels[i]||"";
      var a = pname(myS[i]), b = pname(opS[i]);
      var ap = fmtPts(myP[i]), bp = fmtPts(opP[i]);
      rows += '<div class="lu-slot">'+esc(lbl)+'</div>'+
        '<div class="pl'+(i===myTop?" top":"")+'"><span class="pp">'+ap+'</span>'+
          '<span class="pn">'+esc(a.n)+(a.meta?(' <span class="pmeta">'+esc(a.meta)+'</span>'):"")+'</span></div>'+
        '<div class="lu-vs">vs</div>'+
        '<div class="pl r'+(i===opTop?" top":"")+'"><span class="pp">'+bp+'</span>'+
          '<span class="pn">'+esc(b.n)+(b.meta?(' <span class="pmeta">'+esc(b.meta)+'</span>'):"")+'</span></div>';
    }
    panel.innerHTML = '<div class="lu-grid">'+rows+'</div>';
  }
  function maxIdx(arr){ var mi=-1, mv=-1; (arr||[]).forEach(function(v,i){ if((Number(v)||0)>mv){mv=Number(v)||0;mi=i;} }); return mv>0?mi:-1; }

  // Players map: fetch once/day, trim to {id:{n,p,t}}, cache (best-effort).
  function loadPlayers(){
    if(ST.playersMap) return Promise.resolve(ST.playersMap);
    var today = new Date().toISOString().slice(0,10);
    try{
      if(ls("ff_pl_date","")===today){
        var cached = JSON.parse(localStorage.getItem("ff_pl")||"null");
        if(cached){ ST.playersMap=cached; return Promise.resolve(cached); }
      }
    }catch(e){}
    return fetchJSON(API+"/players/nfl").then(function(all){
      var map = {};
      for(var id in all){ if(!all.hasOwnProperty(id)) continue;
        var p = all[id];
        map[id] = { n: p.full_name || ((p.first_name||"")+" "+(p.last_name||"")).trim() || id,
                    p: p.position||"", t: p.team||"" };
      }
      ST.playersMap = map;
      try{ localStorage.setItem("ff_pl", JSON.stringify(map)); lsSet("ff_pl_date", today); }catch(e){}
      return map;
    });
  }

  // ── Empty / error screens ──────────────────────────
  function renderEmpty(kind){
    if(kind==="no-leagues"){
      app.innerHTML = '<div class="empty"><div class="big">🗓️</div><h2>No '+esc(ST.season)+' leagues found</h2>'+
        '<p>Sleeper shows no leagues for <b>'+esc(cfg.user)+'</b> in '+esc(ST.season)+'.<br>'+
        'Different username or season? <button class="linkbtn" id="openS">Open settings</button></p></div>';
      var b=$("#openS"); if(b) b.addEventListener("click", openSheet);
    }
    refreshStatusLine();
  }
  function showFatal(e){
    ST.loading=false;
    var msg = (e&&e.message)==="NO_USER"
      ? 'No Sleeper user named <b>'+esc(cfg.user)+'</b>.'
      : 'Couldn’t reach Sleeper ('+esc((e&&e.message)||"network")+').';
    setStatus("Error", "err");
    app.innerHTML = '<div class="empty"><div class="big">⚠️</div><h2>Couldn’t load scores</h2>'+
      '<p>'+msg+'<br><button class="linkbtn" id="retryB">Try again</button> · '+
      '<button class="linkbtn" id="openS2">Settings</button></p></div>';
    var r=$("#retryB"); if(r) r.addEventListener("click", reload);
    var s=$("#openS2"); if(s) s.addEventListener("click", openSheet);
  }

  // ── Polling ────────────────────────────────────────
  function schedule(){
    clearTimeout(ST.timer);
    if(!cfg.interval || cfg.interval<=0) return;
    ST.timer = setTimeout(tick, cfg.interval*1000);
  }
  function tick(){
    if(document.hidden){ schedule(); return; }
    if(!ST.user || !ST.leagues.length){ schedule(); return; }
    loadAllMatchups(false).catch(function(){}).then(schedule);
  }
  document.addEventListener("visibilitychange", function(){
    if(!document.hidden && ST.user && ST.leagues.length){
      // refresh immediately when returning to the tab
      loadAllMatchups(false).catch(function(){}).then(function(){ schedule(); });
    }
  });

  // manual refresh
  function reload(){
    ST.model={}; ST.openSet={}; app.innerHTML='<div class="skeleton"></div><div class="skeleton"></div>';
    boot();
  }
  $("#refreshBtn").addEventListener("click", function(){
    var b=this; b.classList.add("spin");
    var p = (ST.user && ST.leagues.length) ? loadAllMatchups(false) : Promise.resolve(boot());
    p.catch(function(){}).then(function(){ b.classList.remove("spin"); schedule(); });
  });

  // ── Settings sheet ─────────────────────────────────
  function openSheet(){
    $("#fUser").value = cfg.user;
    $("#fSeason").value = cfg.season;
    $("#fInterval").value = String(cfg.interval);
    $("#scrim").classList.add("show"); $("#sheet").classList.add("show");
  }
  function closeSheet(){ $("#scrim").classList.remove("show"); $("#sheet").classList.remove("show"); }
  $("#settingsBtn").addEventListener("click", openSheet);
  $("#scrim").addEventListener("click", closeSheet);
  $("#saveBtn").addEventListener("click", function(){
    var u=$("#fUser").value.trim(), s=$("#fSeason").value.trim(), iv=$("#fInterval").value;
    cfg.user = u||DEFAULT_USER; cfg.season=s; cfg.interval=parseInt(iv,10)||0;
    lsSet("ff_user", cfg.user); lsSet("ff_season", cfg.season); lsSet("ff_interval", String(cfg.interval));
    closeSheet(); reload();
  });

  // keep the "updated Xs ago" label fresh
  setInterval(function(){ if(!ST.loading && ST.lastOK) refreshStatusLine(); }, 5000);

  // go
  boot(); schedule();
})();
</script>
</body>
</html>
